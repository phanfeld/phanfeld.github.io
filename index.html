<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pia Hanfeld | AI Security Researcher</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Amber theme, mirrors the Obsidian vault snippet "graphite-amber":
           dark = tinted graphite + one amber accent, light = Keepsake paper and ink. */
        :root {
            --bg-color: #121419;
            --bg-alt: #181c22;
            --bg-deep: #0b0d10;
            --border: #232830;
            --border-hover: #2b313a;
            --text-color: #f2f4f7;
            --body-text: #B0B7C0;
            --secondary-text: #666E79;
            --accent-color: #ffb000;
            --accent-hover: #FFC440;
            --on-accent: #0b0d10;
            --selection: rgba(255, 176, 0, 0.28);
            --error: #FF6B5E;
            --radius-s: 6px;
            --radius-m: 10px;
            --max-width: 800px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #FAFAFA;
                --bg-alt: #F2F2F0;
                --bg-deep: #E9E9E6;
                --border: #E2E2DE;
                --border-hover: #cfcfca;
                --text-color: #111111;
                --body-text: #555555;
                --secondary-text: #8A8A8A;
                --accent-color: #8a5a00;
                --accent-hover: #6b4600;
                --on-accent: #FAFAFA;
                --selection: rgba(138, 90, 0, 0.18);
                --error: #B3261E;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::selection { background: var(--selection); }

        body {
            background-color: var(--bg-color);
            color: var(--body-text);
            font-family: "Ubuntu", "Ubuntu Sans", "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            padding: 2rem;
        }

        .container { max-width: var(--max-width); margin: 0 auto; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: var(--text-color); letter-spacing: .01em; }
        .nav-links a {
            color: var(--body-text);
            text-decoration: none;
            margin-left: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-s);
            font-size: 0.9rem;
            transition: color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent-color);
            background: var(--bg-alt);
            box-shadow: inset 3px 0 0 var(--accent-color);
        }

        section { margin-bottom: 5rem; animation: fadeIn 0.5s ease-in; }

        h1 { font-size: 3rem; line-height: 1.1; margin-bottom: 1.5rem; font-weight: 700; color: var(--text-color); letter-spacing: .01em; }
        h2 {
            font-size: 1.5rem; margin-top: 3rem; margin-bottom: 1.5rem;
            color: var(--text-color); border-left: 3px solid var(--accent-color);
            padding-left: 1rem; font-weight: 700;
        }
        h3 { font-size: 1.2rem; margin-top: 2rem; margin-bottom: 0.5rem; color: var(--text-color); }
        p { margin-bottom: 1rem; color: var(--body-text); }
        ul { margin-bottom: 1rem; margin-left: 1.5rem; color: var(--body-text); }
        li { margin-bottom: 0.5rem; }
        li::marker { color: var(--accent-color); }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 3rem 0; }
        strong { color: var(--text-color); }
        em { color: var(--secondary-text); font-style: normal; font-size: 0.9em; }
        code { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 0.1em 0.4em; font-size: 0.9em; }
        blockquote { border-left: 3px solid var(--accent-color); background: var(--bg-alt); border-radius: 0 var(--radius-m) var(--radius-m) 0; padding: 0.6rem 1rem; margin-bottom: 1rem; }

        .btn-container { margin-top: 2.5rem; display: flex; gap: 1rem; }
        .btn {
            display: inline-block; text-decoration: none;
            color: var(--on-accent); background-color: var(--accent-color);
            padding: 0.5rem 1.2rem; border-radius: var(--radius-m);
            font-weight: 600; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: var(--accent-hover); color: var(--on-accent); text-decoration: none; transform: translateY(-1px); }
        .btn-outline {
            background-color: transparent; color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }
        .btn-outline:hover { background-color: var(--selection); color: var(--accent-color); }

        footer {
            text-align: center; font-size: 0.8rem; color: var(--secondary-text);
            margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            nav { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .nav-links a { margin-left: 0; margin-right: 0.4rem; padding-left: 0.6rem; padding-right: 0.6rem; }
            h1 { font-size: 2.2rem; }
            .btn-container { flex-direction: column; }
            .btn { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <div class="logo">Pia Hanfeld</div>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#research">Research</a>
                <a href="#projects">Projects</a>
                <a href="#cv">CV</a>
            </div>
        </nav>

        <section id="about"></section>
        <section id="research"></section>
        <section id="projects"></section>
        <section id="cv"></section>

        <footer>&copy; 2026 Pia Hanfeld. AI Security Research.</footer>
    </div>

    <script>
        async function loadContent(file, elementId) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                document.getElementById(elementId).innerHTML = marked.parse(text);
            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById(elementId).innerHTML = `<p style="color:var(--error)">Error loading ${file}. Ensure you are running a local server.</p>`;
            }
        }

        loadContent('content/about.md', 'about');
        loadContent('content/research.md', 'research');
        loadContent('content/projects.md', 'projects');
        loadContent('content/cv.md', 'cv');
    </script>
</body>
</html>
