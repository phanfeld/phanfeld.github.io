<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pia Hanfeld | AI Security Researcher</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #e0e0e0;
            --accent-color: #00ff88;
            --secondary-text: #888888;
            --card-bg: #1a1a1a;
            --max-width: 800px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            padding: 2rem;
        }

        .container { max-width: var(--max-width); margin: 0 auto; }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: #ffffff; }
        .nav-links a {
            color: var(--secondary-text);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--accent-color); }

        /* Markdown Content Styling */
        section { margin-bottom: 5rem; animation: fadeIn 0.5s ease-in; }
        
        /* Typography mapped from Markdown */
        h1 { font-size: 3rem; line-height: 1.1; margin-bottom: 1.5rem; font-weight: 800; color: #ffffff; }
        h2 { 
            font-size: 1.5rem; margin-top: 3rem; margin-bottom: 1.5rem; 
            color: var(--accent-color); border-left: 3px solid var(--accent-color); 
            padding-left: 1rem; 
        }
        h3 { font-size: 1.2rem; margin-top: 2rem; margin-bottom: 0.5rem; color: #ffffff; }
        p { margin-bottom: 1rem; color: #cccccc; }
        ul { margin-bottom: 1rem; margin-left: 1.5rem; color: #cccccc; }
        li { margin-bottom: 0.5rem; }
        a { color: var(--accent-color); text-decoration: none; }
        hr { border: 0; border-top: 1px solid #333; margin: 3rem 0; }
        strong { color: #ffffff; }
        em { color: var(--secondary-text); font-style: normal; font-size: 0.9em; }

        /* Specific class for Buttons */
        .btn-container { margin-top: 2.5rem; display: flex; gap: 1rem; }
        .btn {
            display: inline-block; text-decoration: none;
            color: var(--bg-color); background-color: var(--text-color);
            padding: 0.5rem 1.2rem; border-radius: 4px;
            font-weight: 600; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #ffffff; transform: translateY(-1px); }
        .btn-outline {
            background-color: transparent; color: var(--text-color);
            border: 1px solid var(--text-color);
        }
        .btn-outline:hover { background-color: rgba(255, 255, 255, 0.1); }

        footer {
            text-align: center; font-size: 0.8rem; color: var(--secondary-text);
            margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            nav { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .nav-links a { margin-left: 0; margin-right: 1.5rem; }
            h1 { font-size: 2.2rem; }
            .btn-container { flex-direction: column; }
            .btn { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <div class="logo">Pia Hanfeld</div>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#projects">Research</a>
                <a href="#cv">CV</a>
            </div>
        </nav>

        <section id="about"></section>
        <section id="projects"></section>
        <section id="cv"></section>

        <footer>&copy; 2026 Pia Hanfeld. AI Security Research.</footer>
    </div>

    <script>
        async function loadContent(file, elementId) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                document.getElementById(elementId).innerHTML = marked.parse(text);
            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById(elementId).innerHTML = `<p style="color:red">Error loading ${file}. Ensure you are running a local server.</p>`;
            }
        }

        loadContent('content/about.md', 'about');
        loadContent('content/projects.md', 'projects');
        loadContent('content/cv.md', 'cv');
    </script>
</body>
</html>
